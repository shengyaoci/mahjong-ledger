<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mahjong Ledger · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#163229;
    --felt-dark:#0F241D;
    --tile:#F1EAD9;
    --tile-2:#E1D5B8;
    --tile-soft:#FBF7EE;
    --ink:#26211A;
    --ink-soft:#6B6152;
    --red:#A6342C;
    --red-2:#8C2B24;
    --green:#4C7A56;
    --font-serif:'Source Serif 4',Georgia,serif;
    --font-sans:'Source Sans 3',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background-color:var(--felt);
    background-image:radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:6px 6px;
    font-family:var(--font-sans);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}
  #app{padding-bottom:96px;}
  *:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
  button{font-family:inherit;}
  input{font-family:inherit;}

  .loading{color:var(--tile);text-align:center;padding:80px 20px;font-size:14px;}

  .app-header{padding:24px 20px 12px;}
  .app-title{font-family:var(--font-serif);font-size:23px;font-weight:700;color:var(--tile);margin:0 0 6px;display:inline-block;}
  .app-title::after{content:'';display:block;width:36px;height:3px;background:var(--red);margin-top:8px;border-radius:2px;}
  .app-subtitle{font-size:13px;color:rgba(241,234,217,.65);margin:0;}

  .panel{background:var(--tile);border-radius:10px;padding:16px;margin:0 16px 16px;
    box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 2px 6px rgba(0,0,0,.25);}
  .panel-title{font-family:var(--font-serif);font-size:17px;font-weight:700;color:var(--ink);
    margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--tile-2);}
  .panel-hint{font-size:13px;color:var(--ink-soft);margin:0 0 12px;line-height:1.6;}

  .board-toggle{display:flex;gap:6px;margin-bottom:14px;}
  .board-toggle button{flex:1;padding:8px 6px;border-radius:6px;border:1px solid var(--tile-2);
    background:var(--tile-soft);color:var(--ink-soft);font-size:13px;cursor:pointer;}
  .board-toggle button.active{background:var(--red);color:var(--tile);border-color:var(--red);}

  .board-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
  .board-row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;padding:10px 4px;border-bottom:1px solid var(--tile-2);}
  .board-row:last-child{border-bottom:none;}
  .rank-cell{display:flex;align-items:center;justify-content:center;}
  .rank-num{font-weight:600;color:var(--ink-soft);font-size:14px;}
  .seal{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
    background:var(--red);color:var(--tile);font-family:var(--font-serif);font-weight:700;font-size:13px;
    transform:rotate(-8deg);box-shadow:0 1px 2px rgba(0,0,0,.3);}
  .name-cell{display:flex;flex-direction:column;padding-left:6px;overflow:hidden;justify-content:center;}
  .name-main{font-size:15px;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .name-meta{font-size:11px;color:var(--ink-soft);}
  .score-cell{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;text-align:right;}
  .score-pos{color:var(--green);}
  .score-neg{color:var(--red);}
  .score-zero{color:var(--ink-soft);}
  .empty-hint{color:var(--ink-soft);font-size:14px;text-align:center;padding:20px 0;margin:0;}

  .player-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
  .player-tile{background:var(--tile-soft);border:1px solid var(--tile-2);color:var(--ink);
    padding:12px 4px;border-radius:6px;font-size:13px;cursor:pointer;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;}
  .player-tile.selected{background:var(--red);border-color:var(--red);color:var(--tile);
    transform:translateY(-2px);box-shadow:0 3px 0 rgba(0,0,0,.3);}
  .player-tile:active{transform:scale(.96);}

  .select-footer{display:flex;justify-content:space-between;align-items:center;}
  .select-count{font-size:14px;color:var(--ink-soft);}

  .btn-primary{background:var(--red);color:var(--tile);border:none;padding:10px 20px;border-radius:999px;
    font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;}
  .btn-primary:disabled{opacity:.35;cursor:not-allowed;}
  .btn-primary:active:not(:disabled){transform:scale(.97);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--tile-2);padding:10px 18px;
    border-radius:999px;font-size:14px;cursor:pointer;}
  .btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);padding:10px 18px;
    border-radius:999px;font-size:14px;cursor:pointer;}

  .score-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .score-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .games-row{padding-bottom:12px;border-bottom:1px dashed var(--tile-2);margin-bottom:2px;}
  .score-name{font-size:15px;color:var(--ink);flex-shrink:0;}
  .score-input,.games-input{width:110px;text-align:right;font-size:16px;font-variant-numeric:tabular-nums;
    padding:8px 10px;border-radius:6px;border:1px solid var(--tile-2);background:var(--tile-soft);color:var(--ink);}
  .score-input:focus,.games-input:focus{border-color:var(--red);}

  .sum-bar{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;
    border-top:1px solid var(--tile-2);border-bottom:1px solid var(--tile-2);margin-bottom:8px;font-size:15px;}
  .sum-value{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;color:var(--ink-soft);}
  .sum-value.sum-ok{color:var(--green);}
  .sum-value.sum-bad{color:var(--red);}
  .sum-warning{display:none;align-items:center;gap:6px;font-size:13px;color:var(--red);margin-bottom:12px;}
  .sum-warning label{display:flex;align-items:center;gap:6px;cursor:pointer;}

  .score-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}

  .history-list{display:flex;flex-direction:column;gap:12px;}
  .history-card{border:1px solid var(--tile-2);border-radius:8px;padding:12px;background:var(--tile-soft);}
  .history-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;}
  .history-head-left{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .history-round{font-family:var(--font-serif);font-weight:700;font-size:15px;color:var(--ink);}
  .games-badge{font-size:11px;color:var(--ink-soft);background:var(--tile-2);padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .history-time{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .history-entries{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-bottom:8px;}
  .history-entry{display:flex;justify-content:space-between;font-size:14px;gap:8px;}
  .history-entry span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-actions{display:flex;gap:8px;justify-content:flex-end;}
  .icon-btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--tile-2);background:transparent;
    color:var(--ink-soft);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .icon-btn:hover{border-color:var(--red);color:var(--red);}

  .table-scroll{overflow-x:auto;}
  .stats-table{width:100%;border-collapse:collapse;font-size:14px;}
  .stats-table th,.stats-table td{padding:8px 10px;text-align:right;white-space:nowrap;}
  .stats-table th:first-child,.stats-table td:first-child{text-align:left;position:sticky;left:0;background:var(--tile);}
  .stats-table thead th{font-weight:600;color:var(--ink-soft);font-size:12px;border-bottom:2px solid var(--tile-2);
    cursor:pointer;user-select:none;}
  .stats-table thead th.sorted{color:var(--red);}
  .stats-table tbody tr:nth-child(even){background:rgba(0,0,0,.025);}
  .stats-name{font-weight:500;color:var(--ink);}

  .roster-list{display:flex;flex-direction:column;gap:8px;}
  .roster-row{display:flex;align-items:center;gap:10px;}
  .roster-idx{width:24px;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .roster-name-input{flex:1;padding:8px 10px;border-radius:6px;border:1px solid var(--tile-2);
    background:var(--tile-soft);font-size:14px;color:var(--ink);}
  .roster-name-input:focus{border-color:var(--red);}
  .danger-zone{margin-top:20px;padding-top:16px;border-top:1px dashed var(--tile-2);display:flex;justify-content:center;}

  .nav-bar-wrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:var(--felt-dark);box-shadow:0 -2px 10px rgba(0,0,0,.35);z-index:40;}
  .nav-bar{display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:4px;}
  .nav-tile{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;
    border:none;padding:6px 4px;cursor:pointer;color:rgba(241,234,217,.55);}
  .nav-char{width:32px;height:32px;border-radius:6px;background:rgba(241,234,217,.08);display:flex;
    align-items:center;justify-content:center;font-family:var(--font-serif);font-size:13px;font-weight:700;
    color:inherit;transition:all .15s ease;letter-spacing:.02em;}
  .nav-label{font-size:10px;}
  .nav-tile.active{color:var(--tile);}
  .nav-tile.active .nav-char{background:var(--red);color:var(--tile);}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--tile);
    padding:10px 18px;border-radius:999px;font-size:13px;z-index:70;box-shadow:0 4px 12px rgba(0,0,0,.3);
    max-width:80%;text-align:center;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;
    justify-content:center;z-index:80;padding:20px;}
  .modal-box{background:var(--tile);border-radius:10px;padding:20px;max-width:320px;width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .modal-message{font-size:14px;color:var(--ink);margin:0 0 16px;line-height:1.6;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>
<div id="root">
  <div id="app"><div class="loading">Loading…</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
  // Paste the Web app config from Firebase Console below.
  const firebaseConfig = {
    apiKey: "AIzaSyB5LyxsA9IUW_eHMvLZKXkTZE83hY5uD7E",
    authDomain: "mahjong-score-eec1b.firebaseapp.com",
    databaseURL: "https://mahjong-score-eec1b-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mahjong-score-eec1b",
    appId: "1:224426301500:web:c9cdb7b735ffe74ef58b39"
  };
  const ROOM_ID = 'mahjong-main'; // Use same value for every participant.
</script>
<script>
  const STORAGE_KEY = 'mahjong20-state-v2';
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  let state = null;
  let currentTab = 'board';
  let boardView = 'total'; // 'total' | 'avgGame'
  let roundFlow = { step:'select', selectedIds:[], editingRoundId:null };
  let confirmModal = null;
  let toastMessage = null;
  let toastTimer = null;
  let statsSortKey = 'total';
  let statsSortDir = 'desc';
  let editorName = localStorage.getItem('mahjong-editor-name') || '';
  let actorUid = '';
  let noteDraft = '';

  function defaultState(){
    const players = [];
    for(let i=1;i<=20;i++){ players.push({ id:'p'+i, name:'Player '+i }); }
    return { players, rounds: [], audit: [], notes: [] };
  }

  let roomRef = null;
  let connected = false;
  let writeBusy = false;
  function setStatus(message){
    const node=document.getElementById('sync-status');
    if(node) node.textContent=message;
  }
  function validateConfig(){
    return firebaseConfig.apiKey !== 'PASTE_API_KEY' &&
      firebaseConfig.projectId !== 'PASTE_PROJECT_ID' &&
      !firebaseConfig.databaseURL.includes('PASTE_DATABASE_URL');
  }
  async function loadState(){
    if(!validateConfig()){
      document.getElementById('app').innerHTML = '<section class="panel" style="margin-top:30px"><h2>Firebase 尚未配置</h2><p>请按照 README.md 填入 Firebase Web 配置，再部署网站。</p></section>';
      return;
    }
    try{
      firebase.initializeApp(firebaseConfig);
      const credential = await firebase.auth().signInAnonymously();
      actorUid = credential.user.uid;
      roomRef = firebase.database().ref('rooms/'+ROOM_ID);
      firebase.database().ref('.info/connected').on('value',snap=>{
        connected=!!snap.val();
        setStatus(connected?'● 在线实时同步':'○ 网络断开，等待连接');
      });
      roomRef.on('value', snap=>{
        const remote=snap.val();
        state = remote && Array.isArray(remote.players) && Array.isArray(remote.rounds) ? remote : defaultState();
        render();
      }, err=>{
        console.error(err);
        setStatus('同步失败：'+err.message);
      });
    }catch(err){
      console.error(err);
      document.getElementById('app').innerHTML='<section class="panel" style="margin-top:30px"><h2>连接 Firebase 失败</h2><p>'+escapeHtml(err.message)+'</p><p>请检查匿名登录、数据库规则和配置。</p></section>';
    }
  }
  // Atomic transaction: read the latest remote data before applying any change.
  function actor(){ return {name:editorName.trim() || '未署名用户', uid:actorUid}; }
  function auditEntry(type, details, before, after){
    return {id:'a'+Date.now()+'_'+Math.random().toString(36).slice(2,10), type, details, before:before||null, after:after||null, actor:actor(), at:new Date().toISOString()};
  }
  async function applyChange(mutator, auditFactory){
    if(!roomRef || writeBusy){ showToast('正在同步，请稍后再试'); return false; }
    writeBusy=true;
    try{
      const result=await roomRef.transaction(current=>{
        const next = current && Array.isArray(current.players) && Array.isArray(current.rounds)
          ? JSON.parse(JSON.stringify(current)) : defaultState();
        const before = JSON.parse(JSON.stringify(next));
        if(mutator(next)===false) return;
        if(auditFactory){
          if(!Array.isArray(next.audit)) next.audit=[];
          next.audit.push(auditFactory(before,next));
        }
        return next;
      },undefined,false);
      if(!result.committed){ showToast('数据已变化，请重新操作'); return false; }
      state=result.snapshot.val();
      render();
      return true;
    }catch(err){
      console.error(err);
      showToast('保存失败：'+err.message);
      return false;
    }finally{ writeBusy=false; }
  }

  function resetRoundFlow(){
    roundFlow = { step:'select', selectedIds:[], editingRoundId:null };
  }

  function setTab(tab){ currentTab = tab; render(); }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fmtNum(n){
    let v = Math.round((n + (n<0?-1e-9:1e-9)) * 100) / 100;
    if(Object.is(v,-0)) v = 0;
    return v.toString();
  }
  function fmtSigned(n){
    const v = fmtNum(n);
    return n > 1e-9 ? '+' + v : v;
  }

  function formatTime(iso){
    const d = new Date(iso);
    const pad = x => String(x).padStart(2,'0');
    return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function computeStats(){
    const roundsOrdered = [...state.rounds].sort((a,b)=>a.number-b.number);
    return state.players.map(p=>{
      let total=0, roundsCount=0, gamesTotal=0, firstCount=0;
      const history=[];
      roundsOrdered.forEach(r=>{
        const e = r.entries.find(en=>en.playerId===p.id);
        if(e){
          total += e.score;
          roundsCount++;
          gamesTotal += (r.games || 0);
          history.push(e.score);
          const maxScore = Math.max(...r.entries.map(x=>x.score));
          if(e.score === maxScore) firstCount++;
        }
      });
      const avgPerRound = roundsCount ? total/roundsCount : 0;
      const avgPerGame = gamesTotal ? total/gamesTotal : 0;
      const last5 = history.slice(-5);
      const last5avg = last5.length ? last5.reduce((s,v)=>s+v,0)/last5.length : 0;
      return { id:p.id, name:p.name, total, roundsCount, gamesTotal, avgPerRound, avgPerGame, firstCount, last5avg };
    });
  }

  // ---------- toast / modal ----------
  function showToast(msg){
    toastMessage = msg;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ toastMessage = null; render(); }, 2600);
  }
  function renderToast(){
    if(!toastMessage) return '';
    return `<div class="toast">${escapeHtml(toastMessage)}</div>`;
  }
  function renderModal(){
    if(!confirmModal) return '';
    const label = confirmModal.confirmLabel || 'Confirm';
    return `
      <div class="modal-overlay">
        <div class="modal-box">
          <p class="modal-message">${escapeHtml(confirmModal.message)}</p>
          <div class="modal-actions">
            <button type="button" class="btn-ghost" data-action="modal-cancel">Cancel</button>
            <button type="button" class="btn-danger" data-action="modal-confirm">${escapeHtml(label)}</button>
          </div>
        </div>
      </div>`;
  }

  // ---------- header / nav ----------
  function renderHeader(){
    return `
      <header class="app-header">
        <h1 class="app-title">Mahjong Ledger</h1>
        <p class="app-subtitle">20 players, four to a round · Live</p><p class="app-subtitle" id="sync-status">○ 正在连接…</p>
      </header>`;
  }
  function renderNav(){
    const tabs = [
      { id:'board', char:'RK', label:'Board' },
      { id:'score', char:'SC', label:'Score' },
      { id:'history', char:'HX', label:'History' },
      { id:'stats', char:'ST', label:'Stats' },
      { id:'roster', char:'PL', label:'Players' },
      { id:'journal', char:'记', label:'记事本' },
    ];
    const items = tabs.map(t => `
      <button type="button" class="nav-tile ${currentTab===t.id?'active':''}" data-action="tab" data-tab="${t.id}">
        <span class="nav-char">${t.char}</span>
        <span class="nav-label">${t.label}</span>
      </button>`).join('');
    return `<div class="nav-bar-wrap"><nav class="nav-bar">${items}</nav></div>`;
  }

  // ---------- board ----------
  function renderBoard(){
    const stats = computeStats();
    let sorted, valueFor;
    if(boardView==='avgGame'){
      sorted = [...stats].sort((a,b)=> b.avgPerGame-a.avgPerGame || a.name.localeCompare(b.name));
      valueFor = s => s.gamesTotal ? fmtSigned(Math.round(s.avgPerGame*100)/100) : '\u2014';
    } else {
      sorted = [...stats].sort((a,b)=> b.total-a.total || a.name.localeCompare(b.name));
      valueFor = s => fmtSigned(s.total);
    }
    const rows = sorted.map((s,i)=>{
      const rank = i+1;
      const rawVal = boardView==='avgGame' ? s.avgPerGame : s.total;
      const scoreClass = rawVal>1e-9 ? 'score-pos' : (rawVal<-1e-9 ? 'score-neg' : 'score-zero');
      const rankHtml = rank===1
        ? `<span class="seal">1</span>`
        : `<span class="rank-num">${rank}</span>`;
      const meta = boardView==='avgGame'
        ? `<span class="name-meta">${s.gamesTotal} game${s.gamesTotal===1?'':'s'}</span>`
        : '';
      return `
        <li class="board-row">
          <span class="rank-cell">${rankHtml}</span>
          <span class="name-cell"><span class="name-main">${escapeHtml(s.name)}</span>${meta}</span>
          <span class="score-cell ${scoreClass}">${valueFor(s)}</span>
        </li>`;
    }).join('');
    const hint = state.rounds.length===0 ? `<p class="empty-hint">No rounds recorded yet &mdash; head to the Score tab to log your first round.</p>` : '';
    return `
      <section class="panel">
        <h2 class="panel-title">Leaderboard</h2>
        <div class="board-toggle">
          <button type="button" class="${boardView==='total'?'active':''}" data-action="board-view" data-view="total">By total</button>
          <button type="button" class="${boardView==='avgGame'?'active':''}" data-action="board-view" data-view="avgGame">By avg/game</button>
        </div>
        <ul class="board-list">${rows}</ul>
        ${hint}
      </section>`;
  }

  // ---------- score entry ----------
  function toggleSelectPlayer(id){
    const idx = roundFlow.selectedIds.indexOf(id);
    if(idx>-1){ roundFlow.selectedIds.splice(idx,1); }
    else{
      if(roundFlow.selectedIds.length>=4) return;
      roundFlow.selectedIds.push(id);
    }
    render();
  }
  function goToScores(){
    if(roundFlow.selectedIds.length!==4) return;
    roundFlow.step = 'scores';
    render();
  }
  function startEditRound(id){
    const r = state.rounds.find(x=>x.id===id);
    if(!r) return;
    roundFlow = { step:'scores', selectedIds:[...r.entries.map(e=>e.playerId)], editingRoundId:id };
    currentTab = 'score';
    render();
  }

  function renderPlayerGrid(){
    const tiles = state.players.map(p=>{
      const selected = roundFlow.selectedIds.includes(p.id);
      return `<button type="button" class="player-tile ${selected?'selected':''}" data-action="toggle-player" data-id="${p.id}">${escapeHtml(p.name)}</button>`;
    }).join('');
    return `<div class="player-grid">${tiles}</div>`;
  }

  function renderScoreRows(round){
    return roundFlow.selectedIds.map(id=>{
      const p = state.players.find(pl=>pl.id===id);
      const existing = round ? round.entries.find(e=>e.playerId===id) : null;
      const val = existing ? existing.score : '';
      return `
        <div class="score-row">
          <label class="score-name" for="input-${id}">${escapeHtml(p ? p.name : '')}</label>
          <input class="score-input" type="number" step="any" id="input-${id}" data-id="${id}" value="${val}" placeholder="0">
        </div>`;
    }).join('');
  }

  function nextRoundNumber(){
    return state.rounds.length ? Math.max(...state.rounds.map(r=>r.number))+1 : 1;
  }

  function renderScore(){
    if(roundFlow.step==='select'){
      const num = roundFlow.editingRoundId
        ? (state.rounds.find(r=>r.id===roundFlow.editingRoundId)?.number || '?')
        : nextRoundNumber();
      const count = roundFlow.selectedIds.length;
      const title = roundFlow.editingRoundId ? ('Editing Round '+num+' \u00b7 Pick the four players') : ('Round '+num+' \u00b7 Pick this round\u2019s four players');
      return `
        <section class="panel">
          <h2 class="panel-title">${title}</h2>
          ${renderPlayerGrid()}
          <div class="select-footer">
            <span class="select-count">Selected ${count} / 4</span>
            <button type="button" class="btn-primary" data-action="to-scores" ${count===4?'':'disabled'}>Next</button>
          </div>
        </section>`;
    }
    const editing = !!roundFlow.editingRoundId;
    const round = editing ? state.rounds.find(r=>r.id===roundFlow.editingRoundId) : null;
    const num = editing ? (round?.number || '?') : nextRoundNumber();
    const gamesVal = round ? round.games : '';
    return `
      <section class="panel">
        <h2 class="panel-title">${editing ? 'Editing Round '+num : 'Round '+num+' \u00b7 Enter scores'}</h2>
        <p class="panel-hint">Winners enter positive numbers, losers negative. If your rules require the four scores to sum to zero, that\u2019s checked automatically.</p>
        <div class="score-rows">
          <div class="score-row games-row">
            <label class="score-name" for="round-games-input">Games this round</label>
            <input class="games-input" type="number" min="1" step="1" id="round-games-input" value="${gamesVal}" placeholder="e.g. 4">
          </div>
          ${renderScoreRows(round)}
        </div>
        <div class="sum-bar">
          <span>Round total</span>
          <span id="score-sum-value" class="sum-value">0</span>
        </div>
        <div id="score-sum-warning" class="sum-warning">
          <label><input type="checkbox" id="allow-nonzero"> Total isn\u2019t zero &mdash; submit anyway</label>
        </div>
        <div class="score-actions">
          <button type="button" class="btn-ghost" data-action="to-select">Reselect players</button>
          ${editing ? `<button type="button" class="btn-ghost" data-action="cancel-edit">Cancel edit</button>` : ''}
          <button type="button" class="btn-primary" id="submit-round-btn" data-action="submit-round">${editing ? 'Save changes' : 'Submit round'}</button>
        </div>
      </section>`;
  }

  function updateFormValidity(){
    const inputs = document.querySelectorAll('.score-input');
    let sum = 0;
    inputs.forEach(inp=>{ const v = parseFloat(inp.value); sum += isNaN(v)?0:v; });
    const sumEl = document.getElementById('score-sum-value');
    const warnEl = document.getElementById('score-sum-warning');
    const allowBox = document.getElementById('allow-nonzero');
    const submitBtn = document.getElementById('submit-round-btn');
    const gamesInput = document.getElementById('round-games-input');
    const isZero = Math.abs(sum) < 1e-9;
    if(sumEl){
      sumEl.textContent = fmtSigned(sum);
      sumEl.classList.toggle('sum-ok', isZero);
      sumEl.classList.toggle('sum-bad', !isZero);
    }
    if(warnEl){ warnEl.style.display = isZero ? 'none' : 'flex'; }
    const allowChecked = allowBox ? allowBox.checked : false;
    const gamesVal = gamesInput ? parseInt(gamesInput.value,10) : NaN;
    const gamesValid = Number.isInteger(gamesVal) && gamesVal >= 1;
    if(submitBtn){ submitBtn.disabled = !((isZero || allowChecked) && gamesValid); }
  }

  async function handleSubmitRound(){
    const gamesInput = document.getElementById('round-games-input');
    const games = gamesInput ? parseInt(gamesInput.value,10) : NaN;
    if(!Number.isInteger(games) || games<1) return;

    const inputs = document.querySelectorAll('.score-input');
    const entries = [];
    inputs.forEach(inp=>{
      const v = parseFloat(inp.value);
      entries.push({ playerId: inp.dataset.id, score: isNaN(v)?0:v });
    });
    const sum = entries.reduce((s,e)=>s+e.score,0);
    const allowBox = document.getElementById('allow-nonzero');
    const allow = allowBox ? allowBox.checked : false;
    if(Math.abs(sum) > 1e-9 && !allow) return;

     if(entries.length!==4 || new Set(entries.map(e=>e.playerId)).size!==4) return;
     const editingId=roundFlow.editingRoundId;
     let roundNumberForToast;
     const newId='r'+Date.now()+'_'+Math.random().toString(36).slice(2,12);
     const timestamp=new Date().toISOString();
     const ok=await applyChange(latest=>{
       if(editingId){
         const r=latest.rounds.find(r=>r.id===editingId);
         if(!r) return false;
         r.entries=entries; r.games=games; r.editedAt=timestamp;
         roundNumberForToast=r.number;
       }else{
         const num=latest.rounds.length?Math.max(...latest.rounds.map(r=>r.number))+1:1;
         latest.rounds.push({id:newId,number:num,timestamp,games,entries});
         roundNumberForToast=num;
       }
     },(before,after)=>{
       const old=editingId?before.rounds.find(r=>r.id===editingId):null;
       const updated=editingId?after.rounds.find(r=>r.id===editingId):after.rounds.find(r=>r.id===newId);
       return auditEntry(editingId?'修改成绩':'新增成绩', '第 '+updated.number+' 轮 · '+updated.games+' 局', old, updated);
     });
     if(!ok) return;
     resetRoundFlow();
     currentTab=editingId?'history':'board';
     render();
     showToast('Round '+roundNumberForToast+(editingId?' updated':' submitted'));
  }

  // ---------- history ----------
  function confirmDeleteRound(id){
    const r = state.rounds.find(x=>x.id===id);
    if(!r) return;
    confirmModal = {
      message: `Delete Round ${r.number}? This removes it from every participant\u2019s total and can\u2019t be undone.`,
      confirmLabel: 'Delete',
      onConfirm: async ()=>{
        const ok=await applyChange(latest=>{
          if(!latest.rounds.some(x=>x.id===id)) return false;
          latest.rounds=latest.rounds.filter(x=>x.id!==id);
        },(before)=>auditEntry('删除成绩','第 '+r.number+' 轮',before.rounds.find(x=>x.id===id),null));
        confirmModal=null;
        render();
        if(ok) showToast('Round '+r.number+' deleted');
      }
    };
    render();
  }

  function renderHistory(){
    const roundsSorted = [...state.rounds].sort((a,b)=> b.number - a.number);
    if(roundsSorted.length===0){
      return `<section class="panel"><h2 class="panel-title">History</h2><p class="empty-hint">No rounds logged yet.</p></section>`;
    }
    const cards = roundsSorted.map(r=>{
      const entriesHtml = r.entries.map(e=>{
        const p = state.players.find(pl=>pl.id===e.playerId);
        const cls = e.score>1e-9 ? 'score-pos' : (e.score<-1e-9 ? 'score-neg' : 'score-zero');
        return `<div class="history-entry"><span>${escapeHtml(p?p.name:'?')}</span><span class="${cls}">${fmtSigned(e.score)}</span></div>`;
      }).join('');
      const gamesLabel = (r.games||0) + ' game' + (r.games===1?'':'s');
      return `
        <div class="history-card">
          <div class="history-head">
            <div class="history-head-left">
              <span class="history-round">Round ${r.number}</span>
              <span class="games-badge">${gamesLabel}</span>
            </div>
            <span class="history-time">${formatTime(r.timestamp)}</span>
          </div>
          <div class="history-entries">${entriesHtml}</div>
          <div class="history-actions">
            <button type="button" class="icon-btn" data-action="edit-round" data-round-id="${r.id}">Edit</button>
            <button type="button" class="icon-btn" data-action="delete-round" data-round-id="${r.id}">Delete</button>
          </div>
        </div>`;
    }).join('');
    return `<section class="panel"><h2 class="panel-title">History</h2><div class="history-list">${cards}</div></section>`;
  }

  // ---------- stats ----------
  function setStatsSort(key){
    if(statsSortKey===key){ statsSortDir = statsSortDir==='desc' ? 'asc' : 'desc'; }
    else{ statsSortKey = key; statsSortDir = 'desc'; }
    render();
  }
  function numClass(n){ return n>1e-9?'score-pos':(n<-1e-9?'score-neg':'score-zero'); }
  function renderStats(){
    const stats = computeStats();
    const dir = statsSortDir==='desc' ? -1 : 1;
    const sorted = [...stats].sort((a,b)=> (a[statsSortKey]-b[statsSortKey])*dir || a.name.localeCompare(b.name));
    const cols = [
      { key:'total', label:'Total' },
      { key:'avgPerGame', label:'Avg/Game' },
      { key:'roundsCount', label:'Rounds' },
      { key:'gamesTotal', label:'Games' },
      { key:'avgPerRound', label:'Avg/Round' },
      { key:'firstCount', label:'1st' },
      { key:'last5avg', label:'Last 5' },
    ];
    const headerCells = cols.map(c=>{
      const arrow = statsSortKey===c.key ? (statsSortDir==='desc'?' \u25be':' \u25b4') : '';
      return `<th data-action="sort-stats" data-key="${c.key}" class="${statsSortKey===c.key?'sorted':''}">${c.label}${arrow}</th>`;
    }).join('');
    const rows = sorted.map(s=>`
      <tr>
        <td class="stats-name">${escapeHtml(s.name)}</td>
        <td class="${numClass(s.total)}">${fmtSigned(s.total)}</td>
        <td class="${numClass(s.avgPerGame)}">${s.gamesTotal ? fmtSigned(Math.round(s.avgPerGame*100)/100) : '\u2014'}</td>
        <td>${s.roundsCount}</td>
        <td>${s.gamesTotal}</td>
        <td class="${numClass(s.avgPerRound)}">${s.roundsCount ? fmtSigned(Math.round(s.avgPerRound*100)/100) : '\u2014'}</td>
        <td>${s.firstCount}</td>
        <td class="${numClass(s.last5avg)}">${s.roundsCount ? fmtSigned(Math.round(s.last5avg*100)/100) : '\u2014'}</td>
      </tr>`).join('');
    return `
      <section class="panel">
        <h2 class="panel-title">Stats</h2>
        <div class="table-scroll">
          <table class="stats-table">
            <thead><tr><th>Player</th>${headerCells}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </section>`;
  }

  // ---------- roster ----------
  function confirmResetAll(){
    confirmModal = {
      message: 'Clear all data? This deletes every round and resets the player list to default names. This can\u2019t be undone.',
      confirmLabel: 'Clear all data',
      onConfirm: async ()=>{
        const ok=await applyChange(latest=>{
          const fresh=defaultState();
          latest.players=fresh.players;
          latest.rounds=[];
        },(before)=>auditEntry('清空数据','清空所有成绩并重置玩家姓名',{players:before.players,rounds:before.rounds},null));
        confirmModal=null;
        if(ok){resetRoundFlow();currentTab='board';render();showToast('All data cleared');}
        else render();
      }
    };
    render();
  }
  function renderRoster(){
    const rows = state.players.map((p,idx)=>`
      <div class="roster-row">
        <span class="roster-idx">${String(idx+1).padStart(2,'0')}</span>
        <input class="roster-name-input" type="text" data-idx="${idx}" value="${escapeHtml(p.name)}" maxlength="16">
      </div>`).join('');
    return `
      <section class="panel">
        <h2 class="panel-title">Players</h2>
        <p class="panel-hint">Changes save automatically when a field loses focus.</p>
        <div class="roster-list">${rows}</div>
        <div class="danger-zone">
          <button type="button" class="btn-danger" data-action="reset-all">Clear all data</button>
        </div>
      </section>`;
  }

  // ---------- audit and shared notebook ----------
  function renderJournal(){
    const logs=[...(state.audit||[])].reverse();
    const notes=[...(state.notes||[])].reverse();
    return `<section class="panel"><h2 class="panel-title">操作身份</h2>
      <p class="panel-hint">填写你的名字，之后每次修改都会附上这个名字和匿名登录设备标识。名字可自行更改，不能作为真实身份认证。</p>
      <input id="editor-name" maxlength="32" placeholder="例如：小王" value="${escapeHtml(editorName)}" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px">
      <p class="panel-hint" style="margin-top:8px">设备标识：${escapeHtml(actorUid.slice(0,10))}…</p></section>
      <section class="panel"><h2 class="panel-title">共享记事本</h2>
      <p class="panel-hint">记录规则、约局时间、特殊说明等；每条笔记保留作者和时间。</p>
      <textarea id="note-text" maxlength="1000" rows="4" placeholder="写点什么……" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px">${escapeHtml(noteDraft)}</textarea>
      <button type="button" class="btn-primary" data-action="add-note">发布笔记</button>
      ${notes.length?notes.map(n=>`<div class="history-card" style="margin-top:12px"><div class="history-head"><b>${escapeHtml(n.actor.name)}</b><span class="history-time">${escapeHtml(new Date(n.at).toLocaleString('zh-CN'))}</span></div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHtml(n.text)}</div></div>`).join(''):'<p class="empty-hint">暂无笔记</p>'}</section>
      <section class="panel"><h2 class="panel-title">修改日志</h2>
      <p class="panel-hint">记录修改人、时间、操作类型及修改前后的内容。此记录可供群友核对，但不是防篡改审计系统。</p>
      ${logs.length?logs.map(a=>`<div class="history-card" style="margin-bottom:10px"><div class="history-head"><b>${escapeHtml(a.type)}</b><span class="history-time">${escapeHtml(new Date(a.at).toLocaleString('zh-CN'))}</span></div>
      <div class="small">${escapeHtml(a.actor.name)} · 设备 ${escapeHtml((a.actor.uid||'').slice(0,10))}…</div>
      <div>${escapeHtml(a.details||'')}</div><details style="margin-top:8px"><summary>查看修改前 / 后</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px">修改前：${escapeHtml(JSON.stringify(a.before,null,2))}
修改后：${escapeHtml(JSON.stringify(a.after,null,2))}</pre></details></div>`).join(''):'<p class="empty-hint">暂无修改记录</p>'}</section>`;
  }
  async function addNote(){
    const value=document.getElementById('note-text')?.value.trim();
    if(!value){showToast('请填写笔记');return;}
    const n={id:'n'+Date.now()+'_'+Math.random().toString(36).slice(2,9),text:value,actor:actor(),at:new Date().toISOString()};
    const ok=await applyChange(latest=>{if(!Array.isArray(latest.notes))latest.notes=[];latest.notes.push(n);},()=>auditEntry('新增笔记',value.slice(0,100),null,n));
    if(ok){noteDraft='';render();showToast('笔记已发布');}
  }

  // ---------- dispatch ----------
  function renderCurrentView(){
    switch(currentTab){
      case 'board': return renderBoard();
      case 'score': return renderScore();
      case 'history': return renderHistory();
      case 'stats': return renderStats();
      case 'roster': return renderRoster();
      case 'journal': return renderJournal();
      default: return renderBoard();
    }
  }

  function render(){
    const app = document.getElementById('app');
    app.innerHTML = renderToast() + renderHeader() + renderCurrentView() + renderNav() + renderModal();
    setStatus(connected?'● 在线实时同步':'○ 正在连接或离线');
    if(currentTab==='score' && roundFlow.step==='scores'){ updateFormValidity(); }
  }

  // ---------- events ----------
  function handleRootClick(e){
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    switch(action){
      case 'tab': setTab(el.dataset.tab); break;
      case 'board-view': boardView = el.dataset.view; render(); break;
      case 'toggle-player': toggleSelectPlayer(el.dataset.id); break;
      case 'to-scores': goToScores(); break;
      case 'to-select': roundFlow.step='select'; render(); break;
      case 'cancel-edit': resetRoundFlow(); currentTab='history'; render(); break;
      case 'submit-round': handleSubmitRound(); break;
      case 'edit-round': startEditRound(el.dataset.roundId); break;
      case 'delete-round': confirmDeleteRound(el.dataset.roundId); break;
      case 'modal-cancel': confirmModal=null; render(); break;
      case 'modal-confirm': if(confirmModal){ const fn = confirmModal.onConfirm; fn(); } break;
      case 'reset-all': confirmResetAll(); break;
      case 'add-note': addNote(); break;
      case 'sort-stats': setStatsSort(el.dataset.key); break;
    }
  }
  function handleRootInput(e){
    if(e.target.id==='note-text') noteDraft=e.target.value;
    if(e.target.classList.contains('score-input') || e.target.id==='round-games-input'){
      updateFormValidity();
    }
  }
  function handleRootChange(e){
    if(e.target.id === 'editor-name'){editorName=e.target.value.trim();localStorage.setItem('mahjong-editor-name',editorName);}
    if(e.target.id === 'allow-nonzero'){ updateFormValidity(); }
    if(e.target.classList.contains('roster-name-input')){
      const idx = Number(e.target.dataset.idx);
      const name = e.target.value.trim() || ('Player '+(idx+1));
      e.target.value = name;
      applyChange(latest=>{if(!latest.players[idx])return false;latest.players[idx].name=name;},(before)=>auditEntry('修改玩家姓名','玩家 '+(idx+1)+'：'+before.players[idx].name+' → '+name,before.players[idx].name,name));
    }
  }

  function init(){
    const root = document.getElementById('root');
    root.addEventListener('click', handleRootClick);
    root.addEventListener('input', handleRootInput);
    root.addEventListener('change', handleRootChange);
    loadState();
  }
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
